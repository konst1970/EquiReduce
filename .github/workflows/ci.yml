name: EquiReduce
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,docs]'
      - run: python -m ruff check src tests examples
      - run: python -m ruff format --check src tests examples
      - run: python -m mypy src/equireduce
      - run: python -m pytest -m 'not lean'
      - run: python -m sphinx -n -W --keep-going -b html docs docs/_build/html
      - run: python -m build
      - run: python -m twine check dist/*
  lean:
    runs-on: ubuntu-latest
    env:
      EQUIREDUCE_REQUIRE_LEAN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
      - run: python -m pip install -e '.[dev]'
      - run: MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
        working-directory: lean
      - run: lake exe cache get Mathlib.Basic.Real.Basic Mathlib.Tactic.FieldSimp Mathlib.Tactic.LinearCombination Mathlib.Tactic.Linarith Mathlib.Tactic.NormNum Mathlib.Tactic.Ring Mathlib.Analysis.Calculus.Deriv.Pow Mathlib.Analysis.Calculus.Deriv.Inv Mathlib.Analysis.Calculus.Deriv.Add Mathlib.Tactic.Convert
        working-directory: lean
      - run: python -m pytest -m lean
